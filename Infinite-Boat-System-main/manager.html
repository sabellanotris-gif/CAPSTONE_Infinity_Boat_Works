<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Project Manager — Infinity Boat Works</title>
<link rel="stylesheet" href="dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="admin-type.css">
    <link rel="icon" type="image/jpeg" href="./images/Rlogo.jpg">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="global-search.css?v=1">
    <link rel="stylesheet" href="nav-badges.css?v=1">
    <script src="nav-badges.js?v=1"></script>
    <link rel="stylesheet" href="mobile.css">

</head>

<body class="dash-manager">

<script>
window.onpageshow = function(e) {
    if (e.persisted) window.location.reload();
};
</script>

<div class="dashboard-layout">

<aside class="sidebar">
    <div>
        <h1 class="logo">BoatShop</h1>
        <nav class="sidebar-menu"></nav>
        <script src="sidebarNav.js"></script>
    </div>
    <button class="logout-btn" onclick="handleLogout();">Logout</button>
</aside>

<main class="main-content">

    <!-- ===== PROFILE DROPDOWN ===== -->
    <div id="adminProfileDropdown" class="admin-notif-dropdown profile-dropdown" role="menu" aria-label="Profile menu">
        <div class="profile-dropdown-header">
            <img id="dropdownAvatar" class="profile-dropdown-avatar" src="./images/user.png" alt="Profile">
            <div class="profile-dropdown-id">
                <p id="dropdownName" class="profile-dropdown-name">Manager</p>
                <p id="dropdownEmail" class="profile-dropdown-email">—</p>
            </div>
        </div>
        <a class="profile-dropdown-item" href="profile.html" role="menuitem">
            <i class="fa-solid fa-user-pen"></i> Edit Profile
        </a>
        <button class="profile-dropdown-item profile-dropdown-logout" id="dropdownLogoutBtn" type="button" role="menuitem">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>

    <div class="topbar">
        <div>
            <h1>Welcome Back, <span id="managerName">Project Manager</span></h1>
            <p>Coordinate boat projects, create build teams, and monitor construction progress.</p>
        </div>
        <div class="topbar-right">
            <button class="profile-image-btn" id="adminProfileBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Open profile menu">
                <img id="adminprofile" src="./images/user.png" class="profile-image" alt="Manager profile">
            </button>
        </div>
    </div>

    <section class="quick-actions">
        <a href="dashorder.html" style="text-decoration:none;color:inherit;">
            <button class="quick-action-btn"><i class="fa-solid fa-list-check"></i> View Orders</button>
        </a>
        <a href="dashprogress.html" style="text-decoration:none;color:inherit;">
            <button class="quick-action-btn"><i class="fa-solid fa-ship"></i> Manage Progress</button>
        </a>
        <a href="dashprogress.html" style="text-decoration:none;color:inherit;">
            <button class="quick-action-btn"><i class="fa-solid fa-users"></i> Create Team</button>
        </a>
    </section>

    <section class="analytics-section">

        <div class="analytics-card">
            <div class="circle-wrap">
                <div class="circle orders-circle">
                    <h2 id="statActive">0</h2>
                </div>
            </div>
            <h3 class="kpi-label">Active Projects</h3>
            <p class="kpi-sub">In construction</p>
        </div>

        <div class="analytics-card">
            <div class="circle-wrap">
                <div class="circle completed-circle">
                    <h2 id="statCompleted">0</h2>
                </div>
            </div>
            <h3 class="kpi-label">Completed</h3>
            <p class="kpi-sub">Ready for delivery</p>
        </div>

        <div class="analytics-card">
            <div class="circle-wrap">
                <div class="circle pending-circle">
                    <h2 id="statPending">0</h2>
                </div>
            </div>
            <h3 class="kpi-label">Awaiting Approval</h3>
            <p class="kpi-sub">Pending orders</p>
        </div>

    </section>

    <section class="dashboard-card manager-recent-card">
        <div class="card-header">
            <h2><i class="fa-solid fa-ship"></i> Recent Boat Projects</h2>
            <a class="card-link" href="dashorder.html">View all →</a>
        </div>
        <div id="recentOrders" class="dash-rows"></div>
    </section>

</main>

</div>

<script type="module" src="manager.js"></script>

<script src="mobile-nav.js"></script>
    <script src="global-search.js?v=1"></script>
</body>
</html>
