<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Infinity Boat Works</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #0f172a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 56px;
            text-align: center;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        .card i {
            font-size: 56px;
            color: #22c55e;
            margin-bottom: 16px;
        }
        .card h2 {
            color: #0f172a;
            margin: 0 0 8px;
            font-size: 24px;
        }
        .card p {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.6;
        }
        .card a {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 12px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .card a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <i class="fa-solid fa-circle-check"></i>
        <h2>Email Verified!</h2>
        <p>Your account has been activated successfully.<br>You may now log in and start ordering.</p>
        <a href="login.html">Go to Login</a>
    </div>
</body>
</html>
