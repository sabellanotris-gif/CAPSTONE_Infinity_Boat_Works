<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Dashboard</title>
<link rel="stylesheet" href="worker.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="dashboard-layout">

<aside class="sidebar">
    <div>
        <h1 class="logo">BoatShop</h1>
        <nav class="sidebar-menu">
            <a href="worker.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
            <a href="worker.html?page=assignments"><i class="fa-solid fa-clipboard-list"></i> My Assignments</a>
            <a href="worker.html?page=profile"><i class="fa-solid fa-user"></i> Profile</a>
        </nav>
    </div>
    <button class="logout-btn" onclick="handleLogout();"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</aside>

<main class="main-content">

    <div id="workerNotifDropdown" class="worker-notif-dropdown">
        <div class="notif-header">
            <h4>Notifications</h4>
            <button id="workerMarkAllRead" class="mark-read-btn">Mark all read</button>
        </div>
        <div id="workerNotifList" class="notif-list"></div>
    </div>

    <div class="topbar">
        <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p class="subtitle" id="pageSubtitle">Welcome back, <span id="workerName"></span></p>
        </div>
        <div class="topbar-right">
            <div class="availability-badge" id="availabilityBadge">
                <i class="fa-solid fa-circle"></i> <span id="availabilityText">Loading...</span>
            </div>
            <div class="notif-bell" id="notifBell">
                <i class="fa-solid fa-bell"></i>
                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
            </div>
        </div>
    </div>

    <div class="content-area" id="contentArea">

        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <i class="fa-solid fa-clipboard-list"></i>
                <div>
                    <span>Total Assignments</span>
                    <h3 id="totalAssignments">0</h3>
                </div>
            </div>
            <div class="stat-card active-stat">
                <i class="fa-solid fa-spinner"></i>
                <div>
                    <span>Active</span>
                    <h3 id="activeAssignments">0</h3>
                </div>
            </div>
            <div class="stat-card complete-stat">
                <i class="fa-solid fa-check-circle"></i>
                <div>
                    <span>Completed</span>
                    <h3 id="completedAssignments">0</h3>
                </div>
            </div>
        </div>

        <div class="section-header">
            <h2 id="sectionTitle">My Assignments</h2>
        </div>

        <div id="assignmentsList" class="assignments-grid">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading assignments...</p>
            </div>
        </div>

        <div id="profileSection" style="display:none;">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <img id="profilePic" src="./images/user.png" alt="Profile">
                    </div>
                    <div class="profile-info">
                        <h3 id="profileName"></h3>
                        <p id="profileEmail"></p>
                        <span class="specialty-badge" id="profileSpecialty"></span>
                    </div>
                </div>
                <div class="profile-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="editName" placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="editPhone" placeholder="Your phone">
                    </div>
                    <div class="form-group">
                        <label>New Password (leave blank to keep current)</label>
                        <input type="password" id="editPassword" placeholder="New password">
                    </div>
                    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
                </div>
            </div>
        </div>

    </div>
</main>
</div>

<div id="projectModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">Project Details</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script type="module" src="worker.js"></script>
</body>
</html>
